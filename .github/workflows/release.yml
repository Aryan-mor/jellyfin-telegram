name: Release

# pnpm release:stable and pnpm release:nightly start this. Stable is the release GitHub calls
# latest. Nightly is a prerelease, so a stable install never sees it.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Who should be offered this update
        required: true
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Version without v. Stable: 1.0.44. Nightly: 1.0.44-nightly.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      CHANNEL: ${{ github.event.inputs.channel }}
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build panel ui
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          # Optional repository secrets. With them, "Automatic" setup needs no api_id typed in.
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "stable version must look like 1.0.44"; exit 1; }
          elif [ "$CHANNEL" = nightly ]; then
            printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$' || { echo "nightly version must look like 1.0.44-nightly.2"; exit 1; }
          else
            echo "bad channel: $CHANNEL"; exit 1
          fi
          mod=github.com/Aryan-mor/jellyfin-telegram/internal
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X $mod/version.Version=$VERSION -X $mod/version.Channel=$CHANNEL -X $mod/config.DefaultAPIID=$API_ID -X $mod/config.DefaultAPIHash=$API_HASH" \
            -o "dist/jellyfin-telegram$ext" ./cmd/jellyfin-telegram
          cd dist
          if [ "$GOOS" = windows ]; then
            zip "jellyfin-telegram-windows-$GOARCH.zip" jellyfin-telegram.exe
          else
            tar czf "jellyfin-telegram-linux-$GOARCH.tar.gz" jellyfin-telegram
          fi
          rm -f jellyfin-telegram jellyfin-telegram.exe
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      CHANNEL: ${{ github.event.inputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.ps1 install.sh install-windows.cmd install-nightly-windows.cmd dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          mark=(--latest)
          if [ "$CHANNEL" = nightly ]; then mark=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes "${mark[@]}" *
